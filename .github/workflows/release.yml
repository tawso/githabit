name: GitHabit Release Build

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      version_name:
        description: 'Release version name (e.g. 1.0.0)'
        required: false
        default: '1.0.0'

jobs:
  build_release:
    name: Build Android App Bundle & Release APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Run test suite
        run: flutter test

      - name: Build Android App Bundle (.aab)
        run: flutter build appbundle --release

      - name: Build Release APK (.apk)
        run: flutter build apk --release

      - name: Upload Release AAB (for Google Play Console)
        uses: actions/upload-artifact@v4
        with:
          name: githabit-release-bundle
          path: build/app/outputs/bundle/release/app-release.aab
          retention-days: 30

      - name: Upload Release APK (Direct Install)
        uses: actions/upload-artifact@v4
        with:
          name: githabit-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30

